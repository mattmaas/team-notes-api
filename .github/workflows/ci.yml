name: CI

# Runs the same checks used locally before every commit (see docs/PROCESS.md):
# restore with a dependency audit, a warnings-as-errors build, the full test suite, and a vulnerability report.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Weekly run so a newly published advisory against an existing dependency is noticed without a code change.
  # GitHub only runs schedules on the default branch.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Linux is the likely deployment target; Windows is where the project was developed.
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

    steps:
      - uses: actions/checkout@v4

      # No NuGet cache: setup-dotnet's cache keys on packages.lock.json, which this repo does not use, and restore
      # takes seconds for two projects.
      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # NuGet audit runs during restore. Treating its warnings (NU1901-NU1904, low to critical) as errors makes a
      # vulnerable direct or transitive package fail the build. `dotnet list package --vulnerable` alone only
      # reports: it exits 0 even when it finds vulnerabilities.
      - name: Restore with dependency audit
        run: >
          dotnet restore TeamNotes.sln
          -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low
          -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Build (warnings are errors)
        run: dotnet build TeamNotes.sln --no-restore --configuration Release -warnaserror

      - name: Test
        run: >
          dotnet test TeamNotes.sln --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Vulnerability report
        if: always()
        run: dotnet list TeamNotes.sln package --vulnerable --include-transitive

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14
